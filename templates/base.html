<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Product Catalogue{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='products.css') }}" />
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo" />
            <h1>Product Catalogue</h1>
        </div>
        <nav>
            <a href="{{ url_for('product_list') }}">Catalogue</a>
            <a href="{{ url_for('product_create') }}">Add Product</a>
        </nav>
    </header>

    <main class="page">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <section class="alerts" aria-label="Status messages">
            {% for category, message in messages %}
            <p class="alert alert-{{ category }}">{{ message }}</p>
            {% endfor %}
        </section>
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
